name: Build, Scan Docker Image and Mail Report

on:
  push:
    branches: [ "main" ]

jobs:
  docker-security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t myapp:${{ github.sha }} .

    - name: Install Trivy
      run: |
        sudo apt-get install wget -y
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.deb
        sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

    - name: Scan Docker image
      run: |
        trivy image \
          --format html \
          --output trivy-report.html \
          myapp:${{ github.sha }}

    - name: Send vulnerability report via email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASS }}
        subject: "Docker Vulnerability Report - ${{ github.repository }}"
        body: |
          Hi Team,

          Please find the attached Docker vulnerability scan report.

          Commit: ${{ github.sha }}
          Repository: ${{ github.repository }}

          Regards,
          CI Pipeline
        to: ${{ secrets.MAIL_TO }}
        from: CI Scanner <${{ secrets.SMTP_USER }}>
        attachments: trivy-report.html
