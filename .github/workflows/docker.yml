name: Build Docker Image, Scan & Email Vulnerability Report

on:
  push:
    branches:
      - main
      - M-VIGNESH3-patch-1

jobs:
  docker-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t myapp:${{ github.sha }} .

      # ✅ Correct & stable Trivy installation (NO 404 issues)
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy installation
        run: |
          trivy --version

      # ✅ Scan Docker image and generate HTML report
      - name: Scan Docker image
        run: |
          trivy image \
            --format html \
            --output trivy-vulnerability-report.html \
            myapp:${{ github.sha }}

      # ✅ Send vulnerability report via email
      - name: Email vulnerability report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Docker Vulnerability Report - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: CI Scanner <${{ secrets.SMTP_USER }}>
          body: |
            Hi Team,

            Please find the attached Docker vulnerability scan report.

            Repository : ${{ github.repository }}
            Commit     : ${{ github.sha }}
            Branch     : ${{ github.ref_name }}

            Regards,
            GitHub Actions CI
          attachments: trivy-vulnerability-report.html
