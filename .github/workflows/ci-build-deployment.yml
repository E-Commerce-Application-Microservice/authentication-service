name: CI Build & Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Custom Image Tag (must be in the exact format vx.x.x, e.g., v1.0.0)'
        required: true
        type: string

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/authentication-service

jobs:
  validate_tag:
    name: Validate Tag Parameter
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.event.inputs.image_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format vx.x.x where x is a number (e.g., v1.0.2)."
            exit 1
          fi
          echo "Tag ${{ github.event.inputs.image_tag }} is valid."

  docker_build:
    name: Docker Build
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.image_tag }} .
          
      - name: Save Docker image
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.image_tag }} > image.tar
        
      - name: Upload image artifact for scanning
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Build Pipeline Failed (Docker Build)
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions
          body: The step to build the Docker image failed for Authentication Service.
          
  image_scan:
    name: Image Scan (Trivy)
    needs: docker_build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load Docker image
        run: docker load < image.tar
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.image_tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          
      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Build Pipeline Failed (Trivy Image Scan)
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions
          body: High or critical vulnerabilities were found in the Docker image by Trivy.

  docker_push:
    name: Docker Push
    needs: image_scan
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load Docker image
        run: docker load < image.tar
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.image_tag }}
          
      - name: Send Final Success Summary Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Build & Deployment Pipeline Succeeded!
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions
          body: |
            The authentication-service Build & Deployment pipeline completed successfully!
            
            Docker Image: ${{ env.DOCKER_IMAGE }}
            Tag Pushed: ${{ github.event.inputs.image_tag }}
            
            The image passed the Trivy vulnerability scan and was published to Docker Hub.

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Build Pipeline Failed (Docker Push)
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions
          body: Pushing the docker image to registry failed.
